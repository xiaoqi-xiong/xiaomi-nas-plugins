<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M-Team 官网</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#263244;background:#f7f8fb;color-scheme:light}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f8fb}
body{display:flex;flex-direction:column}
#native-toolbar{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:8px;pointer-events:none;font-size:13px}
#native-toolbar[hidden]{display:none}
#native-back,#official-link{display:flex;align-items:center;gap:5px;min-height:40px;padding:0 13px;border:1px solid #d7dfeb99;border-radius:22px;background:#ffffffdf;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#33445f;font:inherit;font-weight:600;box-shadow:0 3px 14px #17243a14;text-decoration:none;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
#native-back span:first-child{font-size:23px;font-weight:400;line-height:1;margin-top:-2px}
#native-back:active,#official-link:active{transform:scale(.96)}
#native-back:focus-visible,#official-link:focus-visible{outline:2px solid #d49d3f;outline-offset:3px}
#official-link{margin-left:auto;background:#263244e8;color:#fff8e8;border-color:#ffffff29}
#native-hint{font-size:12px;background:#fffef5;color:#6a512d;border-radius:10px;padding:8px 10px;box-shadow:0 2px 12px #0001}
#native-hint:empty{display:none}
#mteam-frame{display:block;width:100%;height:100%;border:0;background:#fcf9f6}
#fallback{position:fixed;left:16px;right:16px;top:50%;z-index:10;transform:translateY(-50%);max-width:480px;margin:auto;padding:22px;border:1px solid #eadfc8;border-radius:16px;background:#fffaf0;color:#4a3b25;box-shadow:0 8px 28px #17243a1c;text-align:center}
#fallback[hidden]{display:none}
#fallback h1{font-size:20px;margin:0 0 8px}
#fallback p{font-size:13px;line-height:1.7;margin:0 0 16px}
#fallback a{display:inline-flex;min-height:42px;padding:0 18px;align-items:center;border-radius:10px;background:#d49d3f;color:#fff;text-decoration:none;font-weight:650}
@media(min-width:700px){#native-toolbar{bottom:22px;left:22px;right:22px}#native-back{display:none}#official-link{margin-left:auto}}
</style>
</head>
<body data-xiaomi-shell>
<nav id="native-toolbar" aria-label="小米客户端导航">
  <button id="native-back" type="button" aria-label="返回小米智能存储" title="返回小米智能存储"><span aria-hidden="true">‹</span><span>小米</span></button>
  <span id="native-hint" aria-live="polite"></span>
  <a id="official-link" href="https://kp.m-team.cc/" target="_blank" rel="noopener noreferrer">↗ 官网</a>
</nav>
<iframe id="mteam-frame" title="M-Team 官方网站" src="https://kp.m-team.cc/" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
<section id="fallback" hidden aria-live="polite">
  <h1>M-Team 官方网站</h1>
  <p>官网保持官方 HTTPS 直连。如果当前客户端不允许嵌入，请使用下面的标准浏览器打开方式。</p>
  <a href="https://kp.m-team.cc/" target="_blank" rel="noopener noreferrer">打开官方站点</a>
</section>
<script src="native-bridge.js"></script>
<script>
const mobileHost=!!(window.flutter_inappwebview||window.android_webview)||/Android|iPhone|iPad/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/i.test(navigator.userAgent));
const toolbar=document.getElementById('native-toolbar');
toolbar.hidden=!mobileHost;
document.getElementById('native-back').onclick=()=>{
  const hint=document.getElementById('native-hint');hint.textContent='正在返回…';
  hs_callHandler('normal_goback',{},response=>{try{const result=JSON.parse(response);hint.textContent=result.code===0?'':'返回失败，请重新打开插件后重试'}catch{hint.textContent='返回失败，请重新打开插件后重试'}})
};
const frame=document.getElementById('mteam-frame'),fallback=document.getElementById('fallback');
let loaded=false;
frame.addEventListener('load',()=>{loaded=true;fallback.hidden=true});
setTimeout(()=>{if(!loaded)fallback.hidden=false},8000);
</script>
</body>
</html>
