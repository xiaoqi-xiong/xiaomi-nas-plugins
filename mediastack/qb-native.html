<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>下载器</title><link rel="stylesheet" href="qb-native.css"></head><body><main>
<header class="head"><img src="icon.png" alt=""><h1 id="heading">下载器</h1><div class="head-actions"><button class="iconbtn" id="settings" aria-label="下载器设置" title="下载器设置" hidden><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 3 1 3 4 2 3-2 3-1 2-4-2-3-1-3-4-2Z"/><circle cx="11" cy="11" r="3"/></svg></button><button class="iconbtn" id="refresh" aria-label="刷新任务" title="刷新任务" hidden><svg viewBox="0 0 24 24"><path d="M20 7V3m0 4h-4M4 17v4m0-4h4M5 8a8 8 0 0 1 15-1M19 16A8 8 0 0 1 4 17"/></svg></button></div></header>
<form id="login" class="login"><h2>登录下载器</h2><p>勾选后，登录资料仅保存到 NAS 本地。</p><label class="field">账号<input id="username" autocomplete="username" required></label><label class="field">密码<input id="password" type="password" autocomplete="current-password" required></label><label class="check"><input id="remember" type="checkbox">记住登录并自动登录</label><button class="button primary">登录</button><p id="login-error" role="alert"></p></form>
<section id="manage" hidden><div id="summary" class="summary"></div><div class="tools"><label class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="query" placeholder="搜索任务名称" aria-label="搜索任务名称"></label><button id="add" class="button soft">添加</button></div><nav id="filters" class="filters" aria-label="任务状态筛选"></nav><div id="tasks"></div><p id="updated" class="status" aria-live="polite"></p></section>
</main><div id="message" role="status" hidden></div>
<dialog id="detail" class="drawer"><div class="sheet-head"><h2 id="detail-title">任务详情</h2><button class="iconbtn" data-close="detail" aria-label="关闭任务详情">✕</button></div><nav class="tabs" id="detail-tabs" aria-label="任务详情标签"></nav><div id="detail-body" class="sheet-body"></div></dialog>
<dialog id="settings-dialog" class="drawer"><div class="sheet-head"><h2>下载器设置</h2><button class="iconbtn" data-close="settings-dialog" aria-label="关闭下载器设置">✕</button></div><nav class="tabs" id="settings-tabs" aria-label="设置分类"></nav><form class="sheet-body" id="settings-form"><div id="settings-body"></div><div class="actions"><button class="button primary" type="submit">保存设置</button><button class="button" id="logout" type="button">退出登录</button></div><p class="muted" id="settings-status" role="status"></p></form></dialog>
<dialog id="add-dialog" class="small-dialog"><div class="sheet-head"><h2>添加下载任务</h2><button class="iconbtn" data-close="add-dialog" aria-label="关闭添加任务">✕</button></div><form id="add-form" class="sheet-body"><p class="notice" id="add-note"></p><label class="field">磁力链接或种子网址<textarea id="add-urls" rows="4" placeholder="每行一个 magnet: 或 https:// 链接"></textarea></label><label class="field">或者选择种子文件<input type="file" id="file-upload" accept=".torrent" multiple></label><label class="field">保存位置<input id="add-path" required></label><label class="check"><input id="add-stopped" type="checkbox">添加后暂不启动</label><div class="actions"><button class="button primary" type="submit">添加任务</button></div></form></dialog>
<script src="qb-native.js"></script></body></html>
