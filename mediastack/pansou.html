<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盘搜</title>
<style>:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#17243a;background:#f6f8fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;font-size:14px;line-height:1.6}main{width:min(100%,1120px);margin:0 auto;padding:28px 32px 40px}.app-header{display:flex;align-items:center;gap:16px;margin:0 0 20px}.app-header img{width:56px;height:56px;border-radius:14px;flex:none}.eyebrow{font-size:12px;color:#728099;letter-spacing:.08em}h1{font-size:24px;line-height:1.35;margin:2px 0;font-weight:650;letter-spacing:-.02em}p{margin:8px 0}.muted,.note{color:#637087;font-size:13px;line-height:1.7}#purpose,.intro{padding:14px 18px;border:1px solid #e3e9f2;border-radius:12px;background:#fff;margin-bottom:22px}input,button,select{font:inherit;border:1px solid #d7dfeb;border-radius:9px;min-height:40px;padding:9px 13px;outline:none}input{background:#fff;color:#17243a;min-width:0}input:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #3b82f61a}button{background:#fff;color:#33445f;font-weight:550;cursor:pointer;transition:background .15s}button:hover{background:#f0f5ff}button:disabled{opacity:.5;cursor:wait}button.primary,#login button,#search button[type=submit]{background:#2563eb;border-color:#2563eb;color:white}button.primary:hover,#login button:hover{background:#1d4ed8}form,.bar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:18px 0}#login{padding:24px;background:white;border:1px solid #e3e9f2;border-radius:14px;box-shadow:0 4px 18px #17243a04;max-width:780px}label{display:flex;flex-direction:column;gap:7px;color:#59667b;font-size:13px;flex:1;min-width:170px}label input{width:100%}.bar{align-items:center;background:#fff;padding:14px 16px;border:1px solid #e3e9f2;border-radius:12px}.bar #logout{margin-left:auto;color:#64748b}#summary{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.metric{flex:1;min-width:150px;background:#fff;border:1px solid #e3e9f2;border-radius:12px;padding:14px 18px}.metric span{display:block;font-size:12px;color:#728099}.metric strong{display:block;font-size:19px;font-weight:650;color:#273c5d;margin-top:3px}.card,.result{background:white;border:1px solid #e3e9f2;padding:20px;margin:14px 0;border-radius:14px;overflow-wrap:anywhere;box-shadow:0 3px 12px #17243a03}.title{font-size:15px;font-weight:650;color:#253955}.card p{margin:10px 0}.card button{font-size:12px;min-height:34px;padding:6px 12px;margin:4px 8px 0 0}.card button:last-child{color:#2563eb}progress{width:100%;height:7px;appearance:none;border:0;border-radius:9px;overflow:hidden;background:#eaf0f8;margin:12px 0}progress::-webkit-progress-bar{background:#eaf0f8}progress::-webkit-progress-value{background:#3b82f6;border-radius:9px}.path{font-size:12px!important;color:#94a0b3!important}#message{white-space:pre-wrap;font-size:13px;color:#65758b;margin:18px 2px}#message[data-tone=error]{color:#b45309;background:#fff7ed;border:1px solid #fed7aa;padding:12px 16px;border-radius:10px}#keyword{flex:1;min-width:160px}#search{padding:16px;background:white;border:1px solid #e3e9f2;border-radius:12px}#search button:not([type=button]){background:#2563eb;color:white;border-color:#2563eb}#search #logout{background:#fff;color:#64748b;border-color:#d7dfeb}.result a{color:#2563eb;font-size:13px;text-decoration:none;display:inline-block;padding:6px 12px;border:1px solid #dbeafe;border-radius:7px;background:#eff6ff}.result p:first-child{font-weight:600;margin:0 0 12px}.empty{padding:36px;text-align:center;color:#7b879b;border:1px dashed #d7dfeb;border-radius:12px;background:#fff}[hidden]{display:none!important}@media(max-width:600px){main{padding:20px 16px}.app-header{gap:12px}.app-header img{width:48px;height:48px}h1{font-size:21px}#login{padding:18px}#login label{flex-basis:100%}#login button{width:100%}.bar{gap:8px;padding:12px}.bar button,.bar select{font-size:13px;padding:8px 10px}.metric{min-width:calc(50% - 10px);padding:12px}.metric strong{font-size:16px}.card{padding:16px}}
</style></head>
<body><main><header class="app-header"><img src="icon.png" alt=""><div><span class="eyebrow">网盘资源搜索</span><h1>盘搜</h1></div></header><p class="note intro">在小米客户端搜索网盘分享。结果来自第三方来源，打开前请核对内容；本站不自动保存或转存。</p>
<form id="login"><label>盘搜账号<input id="username" autocomplete="username" required></label><label>盘搜密码<input id="password" type="password" autocomplete="current-password" required></label><label style="flex-direction:row;align-items:center;min-width:240px"><input id="remember" type="checkbox" style="width:18px;min-height:18px">记住登录并自动登录</label><button>登录</button></form>
<form id="search" hidden><input id="keyword" placeholder="输入影视或资源名称" aria-label="搜索关键词" required><button type="submit">搜索</button><button id="logout" type="button">退出登录</button></form><p id="message" aria-live="polite"></p><div id="results"></div>
<script>
async function nativeSession(method='GET',data){let r=await fetch('native/session',{cache:'no-store',method,headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error('账号或密码未通过，请重新登录');return r.json()}
let token='';const $=id=>document.getElementById(id);function say(s){$('message').textContent=s}
async function api(path,data){let r=await fetch('api/'+path,{cache:'no-store',method:'POST',headers:{'Content-Type':'application/json',...(token?{'X-Application-Authorization':'Bearer '+token}:{})},body:JSON.stringify(data)});if(!r.ok){let message='请求失败（'+r.status+'）';if((r.status===401||r.status===403)&&token){token='';$('login').hidden=false;$('search').hidden=true;$('results').replaceChildren();message='盘搜登录已失效，请重新登录。'}throw Error(message)}return r.json()}
$('login').onsubmit=async e=>{e.preventDefault();say('正在登录…');try{let j=await nativeSession('POST',{username:$('username').value,password:$('password').value,remember:$('remember').checked});token=j.token||j.data?.token||'';if(!token)throw Error('账号或密码未通过');$('password').value='';$('login').hidden=true;$('search').hidden=false;say('登录成功')}catch(e){say(e.message)}};
$('search').onsubmit=async e=>{e.preventDefault();let btn=$('search').querySelector('button');btn.disabled=true;say('正在搜索…');$('results').replaceChildren();try{let j=await api('search',{kw:$('keyword').value,src:'plugin',plugins:['pansearch'],res:'merge'});if(j.code!==0)throw Error(j.message||'搜索失败');let d=j.data||{};say('找到 '+(d.total||0)+' 条结果');for(let [type,rows] of Object.entries(d.merged_by_type||{}))for(let row of rows){let box=document.createElement('div');box.className='result';let title=document.createElement('p');title.textContent=type+' · '+(row.note||'分享资源');box.append(title);let link=document.createElement('a');try{let u=new URL(row.url);if(!['https:','http:'].includes(u.protocol))continue;link.href=u.href;link.rel='noopener noreferrer';link.target='_blank';link.textContent='打开分享链接';box.append(link)}catch{continue}if(row.password){let p=document.createElement('p');p.textContent='提取码：'+row.password;box.append(p)}$('results').append(box)}}catch(e){say(e.message)}finally{btn.disabled=false}};
$('logout').onclick=async()=>{try{await nativeSession('DELETE')}catch{say('退出失败，请重试');return}token='';$('login').hidden=false;$('search').hidden=true;$('results').replaceChildren();say('已退出，自动登录已关闭')};
(async()=>{try{let j=await nativeSession();token=j.token||'';if(!token)return;$('login').hidden=true;$('search').hidden=false;say('已自动登录')}catch{say('请输入账号密码登录')}})();
</script></main></body></html>
