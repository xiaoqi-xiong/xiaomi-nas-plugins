<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影音工具</title>
<style>:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:#f4f6fa;color:#172136}main{max-width:700px;margin:auto;padding:28px 20px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.7;color:#566279}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:24px 0}a{display:block;background:#fff;border:1px solid #dde3ee;border-radius:14px;padding:20px;color:inherit;text-decoration:none}a:focus,a:hover{border-color:#3477ec}b{font-size:19px}small{display:block;color:#68758b;line-height:1.6;margin-top:10px}.note{font-size:14px}#status{font-size:13px;color:#67748a}@media(prefers-color-scheme:dark){body{background:#101723;color:#e5ecf8}a{background:#1a2537;border-color:#33415a}p,small{color:#acbad0}}</style></head>
<body><main><h1>影音工具</h1><p>在小米智能存储中搜索资源、管理下载。观看影片请打开小米自带的「影视」。</p>
<div class="grid"><a href="moviepilot/"><b>MoviePilot</b><small>影视搜索、订阅与自动整理</small></a><a href="pt/"><b>PT 下载器</b><small>馒头直连 · 上传 1MiB/s · 持续保种</small></a><a href="public/"><b>公共下载器</b><small>应用代理 · 上传 1MiB/s · 完成停止</small></a><a href="pansou.html"><b>盘搜</b><small>搜索网盘分享资源</small></a></div>
<p class="note">各工具保留自己的登录。此入口不改变飞牛任务，也不把小米原生功能接入代理。</p><p id="status">正在检查原生入口…</p>
<script>fetch('status.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.getElementById('status').textContent=d.native_user_ok?'原生登录已通过 · 应用入口正在验收':'原生身份未通过'}).catch(()=>{document.getElementById('status').textContent='入口检测暂不可用'});</script></main></body></html>
