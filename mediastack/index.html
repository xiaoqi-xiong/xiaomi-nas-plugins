<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>资源中心</title>
  <link rel="stylesheet" href="resource-center.css">
</head>
<body data-xiaomi-shell>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">资</div>
      <div class="brand-copy">
        <span class="eyebrow">MEDIA TOOLS</span>
        <h1>资源中心</h1>
      </div>
      <button id="native-back" class="native-back" type="button" aria-label="返回小米智能存储" title="返回小米智能存储">
        <span aria-hidden="true">‹</span><span>小米</span>
      </button>
    </header>

    <div class="workspace">
      <nav id="side-tabs" class="side-tabs" aria-label="资源中心功能">
        <button class="tab is-active" type="button" data-tab="search" aria-selected="true">
          <span class="tab-icon" aria-hidden="true">⌕</span><span><strong>搜索</strong><small>盘搜资源</small></span>
        </button>
        <button class="tab" type="button" data-tab="pt" aria-selected="false">
          <span class="tab-icon" aria-hidden="true">↓</span><span><strong>PT 下载</strong><small>直连 · 私有站点</small></span>
        </button>
        <button class="tab" type="button" data-tab="public" aria-selected="false">
          <span class="tab-icon" aria-hidden="true">⇩</span><span><strong>公共下载</strong><small>代理 · 常规资源</small></span>
        </button>
      </nav>

      <main class="content">
        <div class="content-heading">
          <div>
            <p id="section-kicker" class="section-kicker">搜索</p>
            <h2 id="section-title">盘搜资源</h2>
          </div>
          <span id="endpoint-mode" class="endpoint-mode">网盘与磁力</span>
        </div>
        <p id="section-description" class="section-description">搜索网盘分享资源。结果来自第三方来源，请在打开前核对内容。</p>
        <section id="frame-host" class="frame-host" aria-live="polite">
          <div id="frame-state" class="frame-state">
            <span class="spinner" aria-hidden="true"></span>
            <span id="frame-state-text">正在载入…</span>
          </div>
        </section>
      </main>
    </div>

    <nav id="bottom-tabs" class="bottom-tabs" aria-label="资源中心功能">
      <button class="tab is-active" type="button" data-tab="search" aria-selected="true"><span class="tab-icon" aria-hidden="true">⌕</span><span>搜索</span></button>
      <button class="tab" type="button" data-tab="pt" aria-selected="false"><span class="tab-icon" aria-hidden="true">↓</span><span>PT 下载</span></button>
      <button class="tab" type="button" data-tab="public" aria-selected="false"><span class="tab-icon" aria-hidden="true">⇩</span><span>公共下载</span></button>
    </nav>
  </div>

  <script src="../native-bridge.js"></script>
  <script src="resource-center.js"></script>
</body>
</html>
