<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoviePilot</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fc}body{display:flex;flex-direction:column}#native-toolbar{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(76px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);pointer-events:none;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui;color:#33445f}#native-toolbar[hidden]{display:none}#native-back{flex:none;display:flex;align-items:center;gap:5px;min-height:40px;padding:0 13px;border:1px solid #d7dfeb99;border-radius:22px;background:#ffffffd9;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#33445f;font:inherit;font-weight:600;box-shadow:0 3px 14px #17243a14;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}#native-back span:first-child{font-size:23px;font-weight:400;line-height:1;margin-top:-2px}#native-back:active{transform:scale(.96)}#native-back:focus-visible{outline:2px solid #7c60df;outline-offset:3px}.moviepilot #native-back{background:#202335d9;border-color:#ffffff29;color:#eeeaff;box-shadow:0 3px 16px #0003}#native-hint{font-size:12px;background:#fffef5;color:#6a512d;border-radius:10px;padding:8px 10px;box-shadow:0 2px 12px #0001}#native-hint:empty{display:none}#mp-frame{display:block;border:0;width:100%;flex:1;min-height:0;background:#10141e}#frame-error{padding:20px;font:16px system-ui}</style></head><body data-xiaomi-shell class="moviepilot">
<nav id="native-toolbar" aria-label="小米客户端导航"><button id="native-back" type="button" aria-label="返回小米智能存储" title="返回小米智能存储"><span aria-hidden="true">‹</span><span>小米</span></button><span id="native-hint" aria-live="polite"></span></nav>
<iframe id="mp-frame" title="MoviePilot 资源管理" allow="fullscreen" referrerpolicy="same-origin"></iframe><p id="frame-error" hidden></p>
<script src="native-bridge.js"></script>
<script>const mobileHost=!!(window.flutter_inappwebview||window.android_webview)||/Android|iPhone|iPad/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/i.test(navigator.userAgent));document.getElementById('native-toolbar').hidden=!mobileHost;document.getElementById('native-back').onclick=()=>{const hint=document.getElementById('native-hint');hint.textContent='正在返回…';hs_callHandler('normal_goback',{},response=>{try{const result=JSON.parse(response);if(result.code!==0)hint.textContent='返回失败，请重新打开插件后重试'}catch{hint.textContent='返回失败，请重新打开插件后重试'}})};try{const base=window.__MICRO_APP_PUBLIC_PATH__||new URL('.',window.location.href).href;const u=new URL('moviepilot/index.html#/',base);document.body.classList.toggle('moviepilot',u.pathname.includes('/moviepilot/'));if(!['http:','https:'].includes(u.protocol))throw Error('原生访问地址不可用');document.getElementById('mp-frame').src=u.href}catch(e){document.getElementById('mp-frame').hidden=true;const p=document.getElementById('frame-error');p.hidden=false;p.textContent=e.message}</script></body></html>
